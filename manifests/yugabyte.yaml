apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-master
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-master-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-master
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-master
    spec:
      containers:
      - name: yb-master
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-master"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--master_addresses=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):7100"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 7000
        - containerPort: 7100
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: yb-master-data
          mountPath: /mnt/data
      volumes:
      - name: yb-master-data
        emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-vaultadmin-user
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: vault-bin
          emptyDir: {}
        - name: shared-creds
          persistentVolumeClaim:
            claimName: vault-creds-pvc
        - name: root-token
          secret:
            secretName: vault-root-token
      initContainers:
        - name: inject-vault
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /bin/vault /vault-bin/vault && chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
      containers:
        - name: create-user
          image: yugabytedb/yugabyte:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "🔐 Configuring Vault DB secrets engine..."

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              echo "⏳ Waiting for YugabyteDB to be ready at ${PGHOST}:${PGPORT}..."
              while true; do
                (echo > /dev/tcp/${PGHOST}/${PGPORT}) >/dev/null 2>&1 && break
                echo "🔄 Still waiting for Yugabyte..."
                sleep 5
              done

              echo "✅ YugabyteDB is available."

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200

              VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)
              export VAULT_TOKEN

              # Enable DB engine
              vault secrets enable -path=yugabyte-db database || true

              echo "📌 Creating 'vaultadmin' role in Yugabyte..."
              STRONG_PWD="$(head -c 64 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 24)"
              echo "Generated Password: $STRONG_PWD"

              vault kv put secret/vaultadmin value="$STRONG_PWD"

              echo "📡 Connecting to Yugabyte to configure 'vaultadmin' role..."

              SQL_OUTPUT=$(ysqlsh -h $PGHOST -p $PGPORT -U yugabyte -d yugabyte -tAc "
              DO \$\$
              DECLARE
                role_exists BOOLEAN;
              BEGIN
                SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vaultadmin') INTO role_exists;

                IF NOT role_exists THEN
                  RAISE NOTICE 'Creating role vaultadmin...';
                  CREATE ROLE vaultadmin WITH LOGIN PASSWORD '$STRONG_PWD' CREATEROLE CREATEDB;
                  GRANT ALL PRIVILEGES ON DATABASE yugabyte TO vaultadmin;
                  RAISE NOTICE 'Role vaultadmin created and privileges granted.';
                ELSE
                  RAISE NOTICE 'Role vaultadmin already exists. Updating privileges...';
                  ALTER ROLE vaultadmin CREATEROLE CREATEDB;
                  RAISE NOTICE 'Privileges updated for existing role vaultadmin.';
                END IF;
              END
              \$\$;
              ")

              echo "⏳ Waiting for 'vaultadmin' role to become usable..."
              RETRIES=0
              MAX_RETRIES=20

              while true; do
                if ysqlsh -h "$PGHOST" -p "$PGPORT" -U vaultadmin -d yugabyte -c '\q' >/dev/null 2>&1; then
                  echo "✅ vaultadmin is ready to use."
                  break
                else
                  echo "🔄 vaultadmin not ready yet. Retrying in 3s..."
                  sleep 3
                  RETRIES=$((RETRIES + 1))
                fi

                if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
                  echo "❌ vaultadmin login failed after $MAX_RETRIES retries."
                  exit 1
                fi
              done

              echo "📝 ysqlsh output:"
              echo "$SQL_OUTPUT"

              echo "✅ Verifying role vaultadmin exists and has correct attributes..."
              ysqlsh -h $PGHOST -p $PGPORT -U yugabyte -d yugabyte -c "SELECT rolname, rolsuper, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname = 'vaultadmin';"

              # ✅ Create vaultadmin's personal DB
              echo "📦 Checking if 'vaultadmin' database exists..."
              EXISTS=$(ysqlsh -h $PGHOST -p $PGPORT -U yugabyte -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='vaultadmin'")

              if [ "$EXISTS" != "1" ]; then
                echo "📦 Creating 'vaultadmin' database..."
                ysqlsh -h $PGHOST -p $PGPORT -U yugabyte -d yugabyte -c "CREATE DATABASE vaultadmin"
              else
                echo "✅ Database 'vaultadmin' already exists."
              fi

              # Vault DB config
              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="readonly,readwrite,admin" \
                connection_url="postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/yugabyte?sslmode=disable" \
                username="vaultadmin" \
                password="$STRONG_PWD"

              # Roles
              vault write yugabyte-db/roles/readonly \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT CONNECT ON DATABASE yugabyte TO \"{{name}}\"; GRANT USAGE ON SCHEMA public TO \"{{name}}\"; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
                default_ttl="1h" \
                max_ttl="24h"

              vault write yugabyte-db/roles/readwrite \
                db_name=yugabyte \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT CONNECT ON DATABASE yugabyte TO \"{{name}}\"; GRANT USAGE ON SCHEMA public TO \"{{name}}\"; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
                default_ttl="1h" \
                max_ttl="24h"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
            - name: shared-creds
              mountPath: /shared-creds
            - name: root-token
              mountPath: /vault-token
              readOnly: true
---
# YugabyteDB Master Service
apiVersion: v1
kind: Service
metadata:
  name: yb-master-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 7000
    name: http
  - port: 7100
    name: rpc
  selector:
    app: yugabyte
    component: yb-master
---
# YugabyteDB TServer StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-tserver
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-tserver-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-tserver
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-tserver
    spec:
      containers:
      - name: yb-tserver
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-tserver"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--tserver_master_addrs=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):9100"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 9000
        - containerPort: 9100
        - containerPort: 5433
          name: ysql
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: yb-tserver-data
          mountPath: /mnt/data
      volumes:
      - name: yb-tserver-data
        emptyDir: {}
---
# YugabyteDB TServer Service
apiVersion: v1
kind: Service
metadata:
  name: yb-tserver-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 9000
    name: http
  - port: 9100
    name: rpc
  - port: 5433
    name: ysql
    targetPort: 5433
  clusterIP: None
  selector:
    app: yugabyte
    component: yb-tserver
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/yugabyte-deployment-oauth2-client-id#value>"
  client-secret: "<path:secret/data/yugabyte-deployment-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/yugabyte-deployment-oauth2-cookie-secret#value>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: yugabyte-gui
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: yugabyte-gui
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://yb-master-service.yugabyte.svc.cluster.local:7000
            - --provider=github  # Or github, oidc, etc.
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://yugabyte.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:yugabyte_gui_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: yugabyte-gui
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: yugabyte-gui
  namespace: yugabyte
spec:
  ingressClassName: apisix
  http:
    - name: yugabyte-gui
      match:
        hosts:
          - yugabyte.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: oauth2-proxy-yugabyte
          servicePort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      containers:
        - name: pgweb
          image: sosedoff/pgweb
          args:
            - --bind=0.0.0.0
            - --listen=8081
            - --host=yb-tserver-service.yugabyte.svc.cluster.local
            - --port=5433
            - --user=yugabyte
            - --url=postgres://yugabyte@yb-tserver-service.yugabyte.svc.cluster.local:5433/yugabyte?sslmode=disable
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  selector:
    app: pgweb
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: pgweb
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: pgweb
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://pgweb.yugabyte.svc.cluster.local:8081
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://pgweb.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:pgweb_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: pgweb
  ports:
    - port: 4180
      targetPort: 4180
      name: http
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  ingressClassName: apisix
  http:
    - name: pgweb-route
      match:
        hosts:
          - pgweb.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: oauth2-proxy-pgweb
          servicePort: 4180
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/pgweb(/.*)?$", "/$1"]
---
apiVersion: v1
kind: Secret
metadata:
  name: pgweb-oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/pgweb-oauth2-client-id#value>"
  client-secret: "<path:secret/data/pgweb-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/pgweb-oauth2-cookie-secret#value>"