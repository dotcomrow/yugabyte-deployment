# =============================================================================
# YugabyteDB (advisory locks enabled for PG compatibility)
# - Enable advisory locks on BOTH master and tserver.
# - Pin to v2025.1.0.0 which includes advisory locks (TP/preview).
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-master
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-master-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-master
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-master
    spec:
      containers:
      - name: yb-master
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-master"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--master_addresses=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):7100"
          # --- REQUIRED for advisory locks (enable + allow preview flag) ---
          - "--ysql_yb_enable_advisory_locks=true"
          - "--allowed_preview_flags_csv=ysql_yb_enable_advisory_locks"
          # --- OPTIONAL flags (leave commented until you need them) ---
          # - "--enable_ysql=true"
          # - "--ysql_num_shards_per_tserver=2"
          # - "--placement_cloud=k8s" "--placement_region=dc1" "--placement_zone=zone1"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 7000
          name: http
        - containerPort: 7100
          name: rpc
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: yb-master-data
          mountPath: /mnt/data
        readinessProbe:
          httpGet:
            path: /api/v1/masters
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/v1/masters
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: yb-master-data
        emptyDir: {}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-vaultadmin-user
  namespace: vault
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: vault-bin
          emptyDir: {}
        - name: shared-creds
          persistentVolumeClaim:
            claimName: vault-creds-pvc
        - name: root-token
          secret:
            secretName: vault-root-token
        - name: kubectl-bin
          emptyDir: {}
      initContainers:
        - name: inject-vault
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /bin/vault /vault-bin/vault && chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh", "-c"]
          args:
            - cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      containers:
        - name: create-user
          image: yugabytedb/yugabyte:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              #!/bin/sh
              set -euo pipefail
              export PATH=$PATH:/home/yugabyte/bin
              echo "🔐 Configuring Vault DB secrets engine..."

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433

              echo "⏳ Waiting for YugabyteDB to be ready at ${PGHOST}:${PGPORT}..."
              while true; do
                (echo > /dev/tcp/${PGHOST}/${PGPORT}) >/dev/null 2>&1 && break
                echo "🔄 Still waiting for Yugabyte..."
                sleep 5
              done
              echo "✅ YugabyteDB is available."

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              vault secrets enable -path=yugabyte-db database || true

              STRONG_PWD="$(head -c 64 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 24)"
              echo "📌 Creating 'vaultadmin' with password: $STRONG_PWD"
              vault kv put secret/vaultadmin value="$STRONG_PWD"

              echo "🔐 Creating/updating Kubernetes secret..."
              cat <<EOF | kubectl apply -f - 
              apiVersion: v1
              kind: Secret
              metadata:
                name: pgweb-secret
                namespace: yugabyte
              type: Opaque
              stringData:
                PGWEB_USER: vaultadmin
                PGWEB_PASS: $STRONG_PWD
              EOF

              echo "🔐 Creating or updating 'vaultadmin'..."
              while true; do
                ROLE_EXISTS=$(ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'vaultadmin'" || true)
                if [ "$ROLE_EXISTS" = "1" ]; then
                  echo "🔄 Role 'vaultadmin' exists, altering..."
                  ALTER_SQL="ALTER ROLE vaultadmin WITH LOGIN PASSWORD '$STRONG_PWD' CREATEROLE CREATEDB;"
                else
                  echo "🆕 Creating role 'vaultadmin'..."
                  ALTER_SQL="CREATE ROLE vaultadmin WITH LOGIN PASSWORD '$STRONG_PWD' CREATEROLE CREATEDB;"
                fi

                if echo "$ALTER_SQL" | ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte; then
                  echo "✅ Role 'vaultadmin' created/updated"
                else
                  echo "❌ Failed to create/alter role 'vaultadmin'"
                  sleep 3
                  continue
                fi

                echo "🔧 Granting privileges on 'yugabyte' DB..."
                if ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "GRANT ALL PRIVILEGES ON DATABASE yugabyte TO vaultadmin;"; then
                  echo "✅ Privileges granted"
                  break
                else
                  echo "❌ Failed to grant privileges. Retrying..."
                  sleep 3
                fi
              done

              echo "🕒 Waiting for 'vaultadmin' to be available for login..."
              while true; do
                if PGPASSWORD="$STRONG_PWD" ysqlsh -h "$PGHOST" -p "$PGPORT" -U vaultadmin -d yugabyte -c '\q' >/dev/null 2>&1; then
                  echo "✅ vaultadmin is ready."
                  break
                fi
                echo "🔁 Waiting for vaultadmin login..."
                sleep 3
              done

              echo "🔍 Verifying vaultadmin role attributes..."
              ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "SELECT rolname, rolsuper, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname='vaultadmin';"

              echo "📦 Checking for personal vaultadmin DB..."
              DB_EXISTS=$(ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='vaultadmin'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo "📦 Creating DB 'vaultadmin'..."
                ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "CREATE DATABASE vaultadmin"
              else
                echo "✅ Database 'vaultadmin' exists."
              fi

              echo "🛠️ Writing Vault DB config and roles..."
              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="*" \
                connection_url="postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/yugabyte?sslmode=disable" \
                username="vaultadmin" \
                password="$STRONG_PWD"

              while true; do
                echo "Disabling yugabyte superuser account..."
                if ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "ALTER USER yugabyte WITH NOLOGIN;"; then
                  echo "✅ Yugabyte superuser account disabled."
                  break
                else
                  echo "❌ Failed to disable account, retrying in 2 seconds..."
                  sleep 2
                fi
              done

              echo "✅ Vault DB secrets engine setup complete."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
            - name: shared-creds
              mountPath: /shared-creds
            - name: root-token
              mountPath: /vault-token
              readOnly: true
            - name: kubectl-bin
              mountPath: /usr/local/bin

---
# YugabyteDB Master Service
apiVersion: v1
kind: Service
metadata:
  name: yb-master-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 7000
    name: http
  - port: 7100
    name: rpc
  selector:
    app: yugabyte
    component: yb-master

---
# YugabyteDB TServer StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-tserver
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-tserver-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-tserver
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-tserver
    spec:
      containers:
      - name: yb-tserver
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-tserver"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--tserver_master_addrs=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):9100"
          # --- REQUIRED: advisory locks + preview flag allowed ---
          - "--ysql_yb_enable_advisory_locks=true"
          - "--allowed_preview_flags_csv=ysql_yb_enable_advisory_locks"
          # --- OPTIONAL: YSQL tweaks (uncomment as needed) ---
          # - "--ysql_max_connections=200"
          # - "--ysql_enable_packed_row=true"
          # - "--ysql_pg_conf_csv=deadlock_timeout=2s"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9100
          name: rpc
        - containerPort: 5433
          name: ysql
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
        - name: yb-tserver-data
          mountPath: /mnt/data
        readinessProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: yb-tserver-data
        emptyDir: {}

---
# YugabyteDB TServer Service (headless)
apiVersion: v1
kind: Service
metadata:
  name: yb-tserver-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 9000
    name: http
  - port: 9100
    name: rpc
  - port: 5433
    name: ysql
    targetPort: 5433
  clusterIP: None
  selector:
    app: yugabyte
    component: yb-tserver

---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/yugabyte-deployment-oauth2-client-id#value>"
  client-secret: "<path:secret/data/yugabyte-deployment-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/yugabyte-deployment-oauth2-cookie-secret#value>"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: yugabyte-gui
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: yugabyte-gui
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://yb-master-service.yugabyte.svc.cluster.local:7000
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://yugabyte.app.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:yugabyte_gui_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: yugabyte-gui
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      containers:
        - name: pgweb
          image: sosedoff/pgweb
          env:
            - name: PGWEB_USER
              valueFrom:
                secretKeyRef:
                  name: pgweb-secret
                  key: PGWEB_USER
            - name: PGWEB_PASS
              valueFrom:
                secretKeyRef:
                  name: pgweb-secret
                  key: PGWEB_PASS
          command:
            - /bin/sh
            - -c
            - |
              exec pgweb \
                --bind=0.0.0.0 \
                --listen=8081 \
                --url=postgres://$PGWEB_USER:$PGWEB_PASS@yb-tserver-service.yugabyte.svc.cluster.local:5433/yugabyte?sslmode=disable
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  selector:
    app: pgweb
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: pgweb
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: pgweb
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://pgweb.yugabyte.svc.cluster.local:8081
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://pgweb.app.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:pgweb_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: pgweb
  ports:
    - port: 4180
      targetPort: 4180
      name: http

---
apiVersion: v1
kind: Secret
metadata:
  name: pgweb-oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/pgweb-oauth2-client-id#value>"
  client-secret: "<path:secret/data/pgweb-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/pgweb-oauth2-cookie-secret#value>"
