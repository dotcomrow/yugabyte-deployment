apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-master
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-master-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-master
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-master
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["yb-master"]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: yb-master
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-master"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--master_addresses=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):7100"
          - "--yb_enable_read_committed_isolation=true"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 7000
          name: http
        - containerPort: 7100
          name: rpc
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        volumeMounts:
        - name: yb-master-data
          mountPath: /mnt/data
        readinessProbe:
          httpGet:
            path: /api/v1/masters
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/v1/masters
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: yb-master-data
        emptyDir: {}
---
# YugabyteDB Master Service
apiVersion: v1
kind: Service
metadata:
  name: yb-master-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 7000
    name: http
  - port: 7100
    name: rpc
  clusterIP: None
  selector:
    app: yugabyte
    component: yb-master
---
# YugabyteDB TServer StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-tserver
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  serviceName: yb-tserver-service
  replicas: 3
  selector:
    matchLabels:
      app: yugabyte
      component: yb-tserver
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-tserver
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["yb-tserver"]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: yb-tserver
        image: yugabytedb/yugabyte:latest
        command: ["/home/yugabyte/bin/yb-tserver"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--tserver_master_addrs=yb-master-0.yb-master-service:7100,yb-master-1.yb-master-service:7100,yb-master-2.yb-master-service:7100"
          - "--rpc_bind_addresses=$(POD_IP):9100"
          - "--yb_enable_read_committed_isolation=true"
          - "--cdc_send_null_before_image_if_not_exists=true"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9100
          name: rpc
        - containerPort: 5433
          name: ysql
        resources:
          requests:
            cpu: 1500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: yb-tserver-data
          mountPath: /mnt/data
        readinessProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/v1/tablet-servers
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: yb-tserver-data
        emptyDir: {}
---
# YugabyteDB TServer Service
apiVersion: v1
kind: Service
metadata:
  name: yb-tserver-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 9000
    name: http
  - port: 9100
    name: rpc
  - port: 5433
    name: ysql
    targetPort: 5433
  clusterIP: None
  selector:
    app: yugabyte
    component: yb-tserver
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yugabyte-app-accounts
  namespace: yugabyte
data:
  users.sql: |
    CREATE ROLE app1 WITH LOGIN PASSWORD 'changeme1';
    GRANT CONNECT ON DATABASE yugabyte TO app1;
    GRANT USAGE ON SCHEMA public TO app1;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app1;

    CREATE ROLE app2 WITH LOGIN PASSWORD 'changeme2';
    GRANT CONNECT ON DATABASE yugabyte TO app2;
    GRANT USAGE ON SCHEMA public TO app2;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO app2;
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/yugabyte-deployment-oauth2-client-id#value>"
  client-secret: "<path:secret/data/yugabyte-deployment-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/yugabyte-deployment-oauth2-cookie-secret#value>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: yugabyte-gui
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: yugabyte-gui
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://yb-master-service.yugabyte.svc.cluster.local:7000
            - --provider=github  # Or github, oidc, etc.
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://yugabyte.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:yugabyte_gui_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: yugabyte-gui
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: yugabyte-gui
  namespace: yugabyte
spec:
  ingressClassName: apisix
  http:
    - name: yugabyte-gui
      match:
        hosts:
          - yugabyte.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: oauth2-proxy-yugabyte
          servicePort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      initContainers:
      - name: wait-for-yugabyte
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for YugabyteDB to be ready..."
          until nc -z yb-tserver-service.yugabyte.svc.cluster.local 5433; do
            echo "YugabyteDB not ready yet, waiting..."
            sleep 5
          done
          echo "YugabyteDB is ready!"
      containers:
        - name: pgweb
          image: sosedoff/pgweb
          args:
            - --bind=0.0.0.0
            - --listen=8081
            - --host=yb-tserver-service.yugabyte.svc.cluster.local
            - --port=5433
            - --user=yugabyte
            - --url=postgres://yugabyte@yb-tserver-service.yugabyte.svc.cluster.local:5433/yugabyte?sslmode=disable
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  selector:
    app: pgweb
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: pgweb
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: pgweb
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://pgweb.yugabyte.svc.cluster.local:8081
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://pgweb.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:pgweb_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  selector:
    app: oauth2-proxy
    component: pgweb
  ports:
    - port: 4180
      targetPort: 4180
      name: http
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  ingressClassName: apisix
  http:
    - name: pgweb-route
      match:
        hosts:
          - pgweb.suncoast.systems
        paths:
          - /*
      backends:
        - serviceName: oauth2-proxy-pgweb
          servicePort: 4180
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri: ["^/pgweb(/.*)?$", "/$1"]
---
apiVersion: v1
kind: Secret
metadata:
  name: pgweb-oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/pgweb-oauth2-client-id#value>"
  client-secret: "<path:secret/data/pgweb-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/pgweb-oauth2-cookie-secret#value>"