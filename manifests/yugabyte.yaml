# =============================================================================
# YugabyteDB (advisory locks enabled for PG compatibility)
# - Enable advisory locks on BOTH master and tserver.
# - Pin to the current running image digest for consistency across restarts.
# - Keep MASTER and TSERVER on the same version (currently 2025.2.0.1).
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-master
  namespace: yugabyte
  labels:
    app: yugabyte
    platform.suncoast.systems/vpa-exclude: "true"
spec:
  serviceName: yb-master
  podManagementPolicy: Parallel
  replicas: 1
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app: yugabyte
      component: yb-master
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-master
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["yb-master"]
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
      containers:
      - name: yb-master
        image: yugabytedb/yugabyte@sha256:fee547e2f32d84ffe02287c01f5ba03921312d6c1e540b955e3599ca79f5160d
        command: ["/home/yugabyte/bin/yb-master"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--master_addresses=yb-master-0.yb-master.yugabyte.svc.cluster.local:7100"
          - "--rpc_bind_addresses=$(POD_IP):7100"
          - "--server_broadcast_addresses=$(POD_NAME).yb-master.yugabyte.svc.cluster.local:7100"
          - "--use_private_ip=never"
          - "--replication_factor=1"
          # --- REQUIRED for advisory locks (enable + allow preview flag) ---
          - "--ysql_yb_enable_advisory_locks=true"
          - "--allowed_preview_flags_csv=ysql_yb_enable_advisory_locks"
          - "--yb_enable_read_committed_isolation=true"
          # --- OPTIONAL flags (leave commented until you need them) ---
          # - "--enable_ysql=true"
          # - "--ysql_num_shards_per_tserver=2"
          # - "--placement_cloud=k8s" "--placement_region=dc1" "--placement_zone=zone1"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 7000
          name: http
        - containerPort: 7100
          name: rpc
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: yb-master-data
          mountPath: /mnt/data
        startupProbe:
          httpGet:
            path: /api/v1/version
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health-check
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/v1/version
            port: http
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: yb-master-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: create-vaultadmin-user
  namespace: vault

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-pgweb-secret
  namespace: yugabyte
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-pgweb-secret-from-vault
  namespace: yugabyte
subjects:
  - kind: ServiceAccount
    name: create-vaultadmin-user
    namespace: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: create-pgweb-secret

---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-vaultadmin-user
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: create-vaultadmin-user
      volumes:
        - name: vault-bin
          emptyDir: {}
        - name: shared-creds
          persistentVolumeClaim:
            claimName: vault-creds-pvc
        - name: root-token
          secret:
            secretName: vault-root-token
        - name: kubectl-bin
          emptyDir: {}
      initContainers:
        - name: inject-vault
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /bin/vault /vault-bin/vault && chmod +x /vault-bin/vault
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
        - name: load-kubectl
          image: alpine/k8s:1.31.4
          command: ["sh", "-c"]
          args:
            - cp /usr/bin/kubectl /kubectl-bin/kubectl && chmod +x /kubectl-bin/kubectl
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      containers:
        - name: create-user
          image: yugabytedb/yugabyte@sha256:fee547e2f32d84ffe02287c01f5ba03921312d6c1e540b955e3599ca79f5160d
          command: ["/bin/bash", "-c"]
          args:
            - |
              #!/bin/sh
              set -euo pipefail
              export PATH=$PATH:/home/yugabyte/bin
              echo "🔐 Configuring Vault DB secrets engine..."

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433

              echo "⏳ Waiting for YugabyteDB to be ready at ${PGHOST}:${PGPORT}..."
              while true; do
                (echo > /dev/tcp/${PGHOST}/${PGPORT}) >/dev/null 2>&1 && break
                echo "🔄 Still waiting for Yugabyte..."
                sleep 5
              done
              echo "✅ YugabyteDB is available."

              export PATH=$PATH:/vault-bin
              export VAULT_ADDR=http://vault.vault.svc.cluster.local:8200
              export VAULT_TOKEN=$(cat /vault-token/VAULT_TOKEN)

              apply_pgweb_secret() {
                cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: pgweb-secret
                namespace: yugabyte
              type: Opaque
              stringData:
                PGWEB_USER: vaultadmin
                PGWEB_PASS: $STRONG_PWD
              EOF
              }

              echo "🔎 Checking if yugabyte login is disabled..."
              LOGIN_ERR="$(ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c '\q' 2>&1 >/dev/null || true)"
              if echo "$LOGIN_ERR" | grep -q 'role "yugabyte" is not permitted to log in'; then
                echo "✅ yugabyte login is disabled; setup likely already completed."
                STRONG_PWD="$(vault kv get -field=value secret/vaultadmin 2>/dev/null || true)"
                if [ -z "$STRONG_PWD" ]; then
                  echo "❌ Vault secret secret/vaultadmin not found; cannot recreate pgweb-secret."
                  exit 1
                fi
                echo "🔐 Ensuring pgweb-secret exists from Vault value..."
                apply_pgweb_secret
                exit 0
              fi

              vault secrets enable -path=yugabyte-db database || true

              STRONG_PWD=""
              while [ "${#STRONG_PWD}" -lt 24 ]; do
                STRONG_PWD="$(LC_ALL=C head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | cut -c1-24)"
              done
              echo "📌 Creating 'vaultadmin' password and storing in Vault..."
              vault kv put secret/vaultadmin value="$STRONG_PWD"

              echo "🔐 Creating/updating Kubernetes secret..."
              apply_pgweb_secret

              echo "🔐 Creating or updating 'vaultadmin'..."
              while true; do
                ROLE_EXISTS=$(ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'vaultadmin'" || true)
                if [ "$ROLE_EXISTS" = "1" ]; then
                  echo "🔄 Role 'vaultadmin' exists, altering..."
                  ALTER_SQL="ALTER ROLE vaultadmin WITH LOGIN PASSWORD '$STRONG_PWD' CREATEROLE CREATEDB;"
                else
                  echo "🆕 Creating role 'vaultadmin'..."
                  ALTER_SQL="CREATE ROLE vaultadmin WITH LOGIN PASSWORD '$STRONG_PWD' CREATEROLE CREATEDB;"
                fi

                if echo "$ALTER_SQL" | ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte; then
                  echo "✅ Role 'vaultadmin' created/updated"
                else
                  echo "❌ Failed to create/alter role 'vaultadmin'"
                  sleep 3
                  continue
                fi

                echo "🔧 Granting privileges on 'yugabyte' DB..."
                if ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "GRANT ALL PRIVILEGES ON DATABASE yugabyte TO vaultadmin;"; then
                  echo "✅ Privileges granted"
                  break
                else
                  echo "❌ Failed to grant privileges. Retrying..."
                  sleep 3
                fi
              done

              echo "🕒 Waiting for 'vaultadmin' to be available for login..."
              while true; do
                if PGPASSWORD="$STRONG_PWD" ysqlsh -h "$PGHOST" -p "$PGPORT" -U vaultadmin -d yugabyte -c '\q' >/dev/null 2>&1; then
                  echo "✅ vaultadmin is ready."
                  break
                fi
                echo "🔁 Waiting for vaultadmin login..."
                sleep 3
              done

              echo "🔍 Verifying vaultadmin role attributes..."
              ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "SELECT rolname, rolsuper, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname='vaultadmin';"

              echo "📦 Checking for personal vaultadmin DB..."
              DB_EXISTS=$(ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='vaultadmin'")
              if [ "$DB_EXISTS" != "1" ]; then
                echo "📦 Creating DB 'vaultadmin'..."
                ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "CREATE DATABASE vaultadmin"
              else
                echo "✅ Database 'vaultadmin' exists."
              fi

              echo "🛠️ Writing Vault DB config and roles..."
              vault write yugabyte-db/config/yugabyte \
                plugin_name=postgresql-database-plugin \
                allowed_roles="*" \
                connection_url="postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/yugabyte?sslmode=disable" \
                username="vaultadmin" \
                password="$STRONG_PWD" \
                max_open_connections=40 \
                max_idle_connections=0 \
                max_connection_lifetime="0s"

              echo "Granting SUPERUSER to vaultadmin (idempotent)..."
              if [ "$(/home/yugabyte/bin/ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -Atc \
                    "select case when exists (select 1 from pg_roles where rolname='vaultadmin' and rolsuper) then 1 else 0 end")" != "1" ]; then
                while true; do
                  if /home/yugabyte/bin/ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -v ON_ERROR_STOP=1 \
                    -c "ALTER ROLE vaultadmin SUPERUSER;"; then
                    break
                  fi
                  echo "❌ Failed to grant SUPERUSER, retrying in 3 seconds..."
                  sleep 3
                done
              fi
              echo "✅ vaultadmin is SUPERUSER"

              # now disable the yugabyte account
              while true; do
                echo "Disabling yugabyte superuser account..."
                if ysqlsh -h "$PGHOST" -p "$PGPORT" -U yugabyte -d yugabyte -c "ALTER USER yugabyte WITH NOLOGIN;"; then
                  echo "✅ Yugabyte superuser account disabled."
                  break
                else
                  echo "❌ Failed to disable account, retrying in 2 seconds..."
                  sleep 2
                fi
              done

              echo "✅ Vault DB secrets engine setup complete."
          volumeMounts:
            - name: vault-bin
              mountPath: /vault-bin
            - name: shared-creds
              mountPath: /shared-creds
            - name: root-token
              mountPath: /vault-token
              readOnly: true
            - name: kubectl-bin
              mountPath: /usr/local/bin

---
# YugabyteDB Master Service
apiVersion: v1
kind: Service
metadata:
  name: yb-master-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  ports:
  - port: 7000
    name: http
  - port: 7100
    name: rpc
  selector:
    app: yugabyte
    component: yb-master

---
# YugabyteDB TServer StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-tserver
  namespace: yugabyte
  labels:
    app: yugabyte
    platform.suncoast.systems/vpa-exclude: "true"
spec:
  serviceName: yb-tserver-service
  replicas: 1
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app: yugabyte
      component: yb-tserver
  template:
    metadata:
      labels:
        app: yugabyte
        component: yb-tserver
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values: ["yb-tserver"]
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
      containers:
      - name: yb-tserver
        image: yugabytedb/yugabyte@sha256:fee547e2f32d84ffe02287c01f5ba03921312d6c1e540b955e3599ca79f5160d
        command: ["/home/yugabyte/bin/yb-tserver"]
        args:
          - "--fs_data_dirs=/mnt/data"
          - "--tserver_master_addrs=yb-master-0.yb-master.yugabyte.svc.cluster.local:7100"
          - "--rpc_bind_addresses=0.0.0.0:9100"
          - "--server_broadcast_addresses=$(POD_NAME).yb-tserver-service.yugabyte.svc.cluster.local:9100"
          - "--use_private_ip=never"
          # --- REQUIRED: advisory locks + preview flag allowed ---
          - "--ysql_yb_enable_advisory_locks=true"
          - "--allowed_preview_flags_csv=ysql_yb_enable_advisory_locks"
          - "--cdc_send_null_before_image_if_not_exists=true"
          - "--yb_enable_read_committed_isolation=true"
          # --- OPTIONAL: YSQL tweaks (uncomment as needed) ---
          # - "--ysql_max_connections=200"
          # - "--ysql_enable_packed_row=true"
          # - "--ysql_pg_conf_csv=deadlock_timeout=2s"
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 9000
          name: http
        - containerPort: 9100
          name: rpc
        - containerPort: 5433
          name: ysql
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "12Gi"
        volumeMounts:
        - name: yb-tserver-data
          mountPath: /mnt/data
        startupProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: ysql
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
  volumeClaimTemplates:
  - metadata:
      name: yb-tserver-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yb-master-pdb
  namespace: yugabyte
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: yugabyte
      component: yb-master

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: yb-tserver-pdb
  namespace: yugabyte
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: yugabyte
      component: yb-tserver

---
apiVersion: v1
kind: Service
metadata:
  name: yb-master
  namespace: yugabyte
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: yugabyte
    component: yb-master
  ports:
  - name: rpc
    port: 7100
    targetPort: 7100

---
# YugabyteDB TServer Service (headless)
apiVersion: v1
kind: Service
metadata:
  name: yb-tserver-service
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  publishNotReadyAddresses: true
  ports:
  - port: 9000
    name: http
  - port: 9100
    name: rpc
  - port: 5433
    name: ysql
    targetPort: 5433
  clusterIP: None
  selector:
    app: yugabyte
    component: yb-tserver

---
apiVersion: v1
kind: Service
metadata:
  name: yb-ysql
  namespace: yugabyte
  labels:
    app: yugabyte
spec:
  selector:
    app: yugabyte
    component: yb-tserver
  ports:
  - name: ysql
    port: 5433
    targetPort: 5433

---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-creds
  namespace: yugabyte
type: Opaque
stringData:
  client-id: "<path:secret/data/yugabyte-deployment-oauth2-client-id#value>"
  client-secret: "<path:secret/data/yugabyte-deployment-oauth2-client-secret#value>"
  cookie-secret: "<path:secret/data/yugabyte-deployment-oauth2-cookie-secret#value>"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: yugabyte-gui
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: yugabyte-gui
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://yb-master-service.yugabyte.svc.cluster.local:7000
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://yugabyte.teleport.app.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:yugabyte_gui_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-yugabyte
  namespace: yugabyte
  annotations:
    teleport.dev/name: "yugabyte-gui"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "yugabyte.teleport.app.suncoast.systems"
    teleport.dev/description: "Yugabyte GUI Service"
  labels:
    app: yugabyte-gui
    app.kubernetes.io/name: yugabyte-gui
    app.kubernetes.io/component: yugabyte-database-ui
    teleport.dev/enroll: "true"
spec:
  selector:
    app: oauth2-proxy
    component: yugabyte-gui
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgweb
  namespace: yugabyte
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgweb
  template:
    metadata:
      labels:
        app: pgweb
    spec:
      containers:
        - name: pgweb
          image: sosedoff/pgweb
          env:
            - name: PGWEB_USER
              valueFrom:
                secretKeyRef:
                  name: pgweb-secret
                  key: PGWEB_USER
            - name: PGWEB_PASS
              valueFrom:
                secretKeyRef:
                  name: pgweb-secret
                  key: PGWEB_PASS
          command:
            - /bin/sh
            - -c
            - |
              until pgweb \
                --bind=0.0.0.0 \
                --listen=8081 \
                --url=postgres://$PGWEB_USER:$PGWEB_PASS@yb-ysql.yugabyte.svc.cluster.local:5433/yugabyte?sslmode=disable; do
                echo "pgweb failed to connect; retrying in 5s" >&2
                sleep 5
              done
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: pgweb
  namespace: yugabyte
spec:
  selector:
    app: pgweb
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
      component: pgweb
  template:
    metadata:
      labels:
        app: oauth2-proxy
        component: pgweb
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://pgweb.yugabyte.svc.cluster.local:8081
            - --provider=github
            - --email-domain=*
            - --client-id=$(OAUTH2_CLIENT_ID)
            - --client-secret=$(OAUTH2_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_COOKIE_SECRET)
            - --redirect-url=https://pgweb.teleport.app.suncoast.systems/oauth2/callback
            - --scope=user:email,read:org
            - --cookie-secure=true
            - --allowed-group=dotcomrow:pgweb_users
          env:
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-id
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: client-secret
            - name: OAUTH2_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: pgweb-oauth2-proxy-creds
                  key: cookie-secret
          ports:
            - containerPort: 4180

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-pgweb
  namespace: yugabyte
  annotations:
    teleport.dev/name: "pgweb"
    teleport.dev/protocol: "http"
    teleport.dev/public-addr: "pgweb.teleport.app.suncoast.systems"
    teleport.dev/description: "PGWeb Service"
  labels:
    app: pgweb
    app.kubernetes.io/name: pgweb
