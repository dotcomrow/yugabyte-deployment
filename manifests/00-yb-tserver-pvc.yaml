apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yb-tserver-data-yb-tserver-0
  namespace: yugabyte
  labels:
    app: yugabyte
    component: yb-tserver
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
